name: Spec Tracking

on:
  push:
    branches: [ main ]
    paths:
      - 'specs/**'
      - 'validation-reports/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview what would be created/closed without making changes'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: spec-tracking
  cancel-in-progress: false

jobs:
  track:
    name: Sync Spec Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Determine Mode
      id: mode
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "mode=backfill" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
        else
          echo "mode=push" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Spec Tracking
      env:
        GH_TOKEN: ${{ github.token }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        bash scripts/spec-tracking.sh \
          "${{ steps.mode.outputs.mode }}" \
          --dry-run="${{ steps.mode.outputs.dry_run }}"
